<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="100%" height="280">
  <defs>
    <!-- Sky Gradients for Day/Night Cycle -->
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" class="sky-top" />
      <stop offset="55%" class="sky-mid" />
      <stop offset="100%" class="sky-bot" />
    </linearGradient>

    <!-- Sun Glow Filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="moonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Soft Vapor Dissipation Filter -->
    <filter id="vaporGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Contrail Gradients (Atmospheric Vapor Trail) -->
    <linearGradient id="contrailGrad" x1="720" y1="30" x2="220" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="30%" stop-color="#bae6fd" stop-opacity="0.75" />
      <stop offset="85%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1" />
    </linearGradient>

    <linearGradient id="mistGrad" x1="720" y1="30" x2="220" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0" />
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="85%" stop-color="#a7f3d0" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <style>
  <![CDATA[
    /* Dynamic color transitions for the sky (20s synchronized cycle) */
    @keyframes skyTopColor {
      0%, 100% { stop-color: #1f1d36; }
      18% { stop-color: #0369a1; }
      35% { stop-color: #0284c7; }
      50% { stop-color: #311432; }
      65% { stop-color: #0b0f19; }
      85% { stop-color: #030712; }
    }
    @keyframes skyMidColor {
      0%, 100% { stop-color: #7c3aed; }
      18% { stop-color: #38bdf8; }
      35% { stop-color: #7dd3fc; }
      50% { stop-color: #be123c; }
      65% { stop-color: #1e1b4b; }
      85% { stop-color: #0f172a; }
    }
    @keyframes skyBotColor {
      0%, 100% { stop-color: #f97316; }
      18% { stop-color: #bae6fd; }
      35% { stop-color: #e0f2fe; }
      50% { stop-color: #fbbf24; }
      65% { stop-color: #312e81; }
      85% { stop-color: #1e293b; }
    }

    .sky-top { animation: skyTopColor 20s ease-in-out infinite; }
    .sky-mid { animation: skyMidColor 20s ease-in-out infinite; }
    .sky-bot { animation: skyBotColor 20s ease-in-out infinite; }

    /* Sun Orbit Animation */
    @keyframes sunOrbit {
      0% {
        transform: translate(60px, 240px) scale(0.8);
        opacity: 0;
      }
      5% {
        opacity: 0.95;
      }
      20% {
        transform: translate(450px, 45px) scale(1.15);
        opacity: 1;
      }
      40% {
        transform: translate(840px, 240px) scale(0.9);
        opacity: 0.95;
      }
      45%, 100% {
        transform: translate(860px, 320px) scale(0.7);
        opacity: 0;
      }
    }

    /* Moon Orbit Animation */
    @keyframes moonOrbit {
      0%, 50% {
        transform: translate(60px, 320px) scale(0.6);
        opacity: 0;
      }
      55% {
        opacity: 0.9;
      }
      75% {
        transform: translate(450px, 50px) scale(1.05);
        opacity: 1;
      }
      95% {
        transform: translate(840px, 240px) scale(0.85);
        opacity: 0.9;
      }
      100% {
        transform: translate(860px, 320px) scale(0.7);
        opacity: 0;
      }
    }

    /* Stars Field Animation */
    @keyframes starFade {
      0%, 45% { opacity: 0; }
      55%, 90% { opacity: 0.95; }
      100% { opacity: 0; }
    }

    @keyframes starTwinkle {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    .sun-group {
      animation: sunOrbit 20s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    .moon-group {
      animation: moonOrbit 20s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    .stars-field {
      animation: starFade 20s ease-in-out infinite;
    }

    .twinkle-fast { animation: starTwinkle 1.8s ease-in-out infinite; }
    .twinkle-slow { animation: starTwinkle 3.2s ease-in-out infinite; }

    /* Sun rays continuous rotation */
    @keyframes rayRotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .sun-rays {
      transform-origin: 0 0;
      animation: rayRotate 16s linear infinite;
    }

    /* ========================================================================= */
    /* VAPOR CONTRAIL SHOOTING STAR WITH PERSISTENCE AND PARTICULATE DISSIPATION */
    /* ========================================================================= */

    /* 1. The Ionized Core Streak: Cuts fast across the sky */
    @keyframes coreFlash {
      0%, 63% {
        stroke-dashoffset: 540;
        opacity: 0;
      }
      63.2% {
        opacity: 1;
      }
      64.4% {
        stroke-dashoffset: 0;
        opacity: 1;
      }
      65.2% {
        opacity: 0.8;
      }
      66.5% {
        opacity: 0;
      }
      100% {
        stroke-dashoffset: 0;
        opacity: 0;
      }
    }

    /* 2. The Vapor Contrail (Dissolves like an airplane contrail / mist) */
    @keyframes vaporDissipate {
      0%, 63% {
        stroke-dashoffset: 540;
        opacity: 0;
        stroke-width: 2px;
      }
      63.3% {
        opacity: 0.9;
        stroke-width: 3px;
      }
      64.4% {
        stroke-dashoffset: 0;
        opacity: 1;
        stroke-width: 4px;
      }
      /* Lingers in the sky like smoke/vapor */
      65.5% {
        opacity: 0.85;
        stroke-width: 5.5px;
      }
      /* Expands, disperses and gently evaporates into the night */
      67.5% {
        opacity: 0.5;
        stroke-width: 7.5px;
      }
      69.5% {
        opacity: 0.15;
        stroke-width: 9px;
      }
      70.5%, 100% {
        opacity: 0;
        stroke-dashoffset: 0;
        stroke-width: 10px;
      }
    }

    /* 3. Outer Atmospheric Dispersion Glow */
    @keyframes outerGlowFade {
      0%, 63% {
        opacity: 0;
      }
      64.2% {
        opacity: 0.7;
      }
      66.0% {
        opacity: 0.45;
      }
      69.0% {
        opacity: 0;
      }
      100% {
        opacity: 0;
      }
    }

    /* 4. Drifting Sparks and Particulates in the wake */
    @keyframes particleSpark1 {
      0%, 63.4% { opacity: 0; transform: translate(0, 0) scale(0.5); }
      63.8% { opacity: 1; transform: translate(-2px, 3px) scale(1.3); }
      66.0% { opacity: 0.6; transform: translate(-6px, 8px) scale(0.9); }
      68.5% { opacity: 0; transform: translate(-10px, 14px) scale(0.3); }
      100% { opacity: 0; }
    }

    @keyframes particleSpark2 {
      0%, 63.8% { opacity: 0; transform: translate(0, 0) scale(0.5); }
      64.2% { opacity: 1; transform: translate(2px, 2px) scale(1.4); }
      66.5% { opacity: 0.7; transform: translate(5px, 7px) scale(1.0); }
      69.0% { opacity: 0; transform: translate(8px, 12px) scale(0.3); }
      100% { opacity: 0; }
    }

    @keyframes particleSpark3 {
      0%, 64.2% { opacity: 0; transform: translate(0, 0) scale(0.5); }
      64.5% { opacity: 1; transform: translate(-3px, 1px) scale(1.5); }
      67.0% { opacity: 0.6; transform: translate(-7px, 6px) scale(0.9); }
      69.5% { opacity: 0; transform: translate(-12px, 11px) scale(0.2); }
      100% { opacity: 0; }
    }

    .trail-core {
      stroke-dasharray: 540;
      animation: coreFlash 20s ease-out infinite;
    }

    .trail-vapor {
      stroke-dasharray: 540;
      animation: vaporDissipate 20s ease-out infinite;
    }

    .trail-outer {
      animation: outerGlowFade 20s ease-out infinite;
    }

    .particle-p1 { animation: particleSpark1 20s ease-out infinite; }
    .particle-p2 { animation: particleSpark2 20s ease-out infinite; }
    .particle-p3 { animation: particleSpark3 20s ease-out infinite; }
    ]]>
  </style>

  <!-- Sky Background -->
  <rect width="900" height="280" rx="16" fill="url(#skyGradient)" />

  <!-- Stars Layer -->
  <g class="stars-field">
    <circle cx="120" cy="45" r="1.6" fill="#ffffff" class="twinkle-fast" />
    <circle cx="180" cy="90" r="2.0" fill="#93c5fd" class="twinkle-slow" />
    <circle cx="240" cy="35" r="1.4" fill="#ffffff" class="twinkle-fast" />
    <circle cx="310" cy="80" r="2.2" fill="#ffffff" class="twinkle-slow" />
    <circle cx="380" cy="40" r="1.5" fill="#93c5fd" class="twinkle-fast" />
    <circle cx="520" cy="50" r="1.9" fill="#ffffff" class="twinkle-slow" />
    <circle cx="580" cy="85" r="1.6" fill="#ffffff" class="twinkle-fast" />
    <circle cx="660" cy="35" r="2.4" fill="#93c5fd" class="twinkle-slow" />
    <circle cx="730" cy="75" r="1.7" fill="#ffffff" class="twinkle-fast" />
    <circle cx="800" cy="45" r="2.0" fill="#ffffff" class="twinkle-slow" />
    <circle cx="850" cy="110" r="1.5" fill="#93c5fd" class="twinkle-fast" />
    <circle cx="150" cy="130" r="1.7" fill="#ffffff" class="twinkle-slow" />
    <circle cx="710" cy="120" r="1.4" fill="#ffffff" class="twinkle-fast" />
  </g>

  <!-- =============================================================== -->
  <!-- LUMINOUS VAPOR CONTRAIL METEOR WITH DISSIPATING SMOKE & PARTICLES-->
  <!-- =============================================================== -->
  <g id="meteorContrailGroup">
    <!-- Layer 1: Diffuse Atmospheric Glow -->
    <path d="M720,30 L220,150" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" class="trail-outer" opacity="0.35" filter="url(#vaporGlow)" />

    <!-- Layer 2: Expanding Dissipating Vapor Smoke (Airplane Contrail effect) -->
    <path d="M720,30 L220,150" stroke="url(#mistGrad)" stroke-linecap="round" class="trail-vapor" filter="url(#vaporGlow)" />

    <!-- Layer 3: Ionized Brilliant Plasma Beam Core -->
    <path d="M720,30 L220,150" stroke="url(#contrailGrad)" stroke-width="2.5" stroke-linecap="round" class="trail-core" />

    <!-- Layer 4: Particulates / Stardust Embers Lingering in the Wake -->
    <g>
      <!-- Spark cluster along upper trail -->
      <circle cx="620" cy="54" r="1.8" fill="#ffffff" class="particle-p1" filter="url(#glow)" />
      <circle cx="605" cy="62" r="1.2" fill="#7dd3fc" class="particle-p1" />
      <circle cx="585" cy="58" r="1.5" fill="#ffffff" class="particle-p2" />

      <!-- Spark cluster along mid trail -->
      <circle cx="490" cy="85" r="2.0" fill="#ffffff" class="particle-p2" filter="url(#glow)" />
      <circle cx="470" cy="94" r="1.3" fill="#a7f3d0" class="particle-p2" />
      <circle cx="450" cy="88" r="1.6" fill="#7dd3fc" class="particle-p3" />

      <!-- Spark cluster along lower trail -->
      <circle cx="360" cy="116" r="2.2" fill="#ffffff" class="particle-p3" filter="url(#glow)" />
      <circle cx="340" cy="126" r="1.4" fill="#38bdf8" class="particle-p3" />
      <circle cx="310" cy="128" r="1.8" fill="#ffffff" class="particle-p3" filter="url(#glow)" />
    </g>
  </g>

  <!-- Animated Sun Group -->
  <g class="sun-group" filter="url(#glow)">
    <g class="sun-rays">
      <circle cx="0" cy="0" r="38" fill="#fef08a" opacity="0.25" />
      <polygon points="0,-46 7,-32 30,-30 32,-7 46,0 32,7 30,30 7,32 0,46 -7,32 -30,30 -32,7 -46,0 -32,-7 -30,-30 -7,-32" fill="#fde047" opacity="0.4" />
    </g>
    <circle cx="0" cy="0" r="26" fill="#fef9c3" />
    <circle cx="0" cy="0" r="22" fill="#facc15" />
    <circle cx="0" cy="0" r="17" fill="#fef08a" />
  </g>

  <!-- Animated Moon Group -->
  <g class="moon-group" filter="url(#moonGlow)">
    <circle cx="0" cy="0" r="20" fill="#f8fafc" />
    <circle cx="7" cy="-5" r="17" fill="#0f172a" opacity="0.88" />
  </g>

  <!-- Landscape Mountains and Waves Silhouettes -->
  <g opacity="0.95">
    <path d="M0,280 L0,195 Q140,150 280,190 T560,185 Q720,145 900,190 L900,280 Z" fill="#1e1b4b" opacity="0.5" />
    <path d="M0,280 L0,215 Q180,175 380,210 Q600,165 900,215 L900,280 Z" fill="#0f172a" opacity="0.8" />
    <path d="M0,280 L0,238 Q220,205 450,235 T900,228 L900,280 Z" fill="#080c14" />
  </g>

  <!-- Clean Title Overlay -->
  <text x="50%" y="254" text-anchor="middle" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="22" font-weight="700" fill="#ffffff" letter-spacing="4">
    THEMEIG
  </text>
  <text x="50%" y="271" text-anchor="middle" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="10" font-weight="500" fill="#94a3b8" letter-spacing="2">
    SOFTWARE ENGINEERING • AUTOMATION &amp; SYSTEMS
  </text>
</svg>
