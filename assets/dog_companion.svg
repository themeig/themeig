<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="220">
  <defs>
    <!-- Synchronized Sky Gradient matching Header 20s cycle -->
    <linearGradient id="footerSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" class="sky-top" />
      <stop offset="60%" class="sky-mid" />
      <stop offset="100%" class="sky-bot" />
    </linearGradient>

    <!-- Warm Hill Horizon Gradient -->
    <linearGradient id="hillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
  </defs>

  <style>
  <![CDATA[
    /* Synchronized 20s Sky Cycle matching Header */
    @keyframes skyTopColor {
      0%, 100% { stop-color: #1f1d36; }
      18% { stop-color: #0369a1; }
      35% { stop-color: #0284c7; }
      50% { stop-color: #311432; }
      65% { stop-color: #0b0f19; }
      85% { stop-color: #030712; }
    }
    @keyframes skyMidColor {
      0%, 100% { stop-color: #7c3aed; }
      18% { stop-color: #38bdf8; }
      35% { stop-color: #7dd3fc; }
      50% { stop-color: #be123c; }
      65% { stop-color: #1e1b4b; }
      85% { stop-color: #0f172a; }
    }
    @keyframes skyBotColor {
      0%, 100% { stop-color: #f97316; }
      18% { stop-color: #bae6fd; }
      35% { stop-color: #e0f2fe; }
      50% { stop-color: #fbbf24; }
      65% { stop-color: #312e81; }
      85% { stop-color: #1e293b; }
    }

    .sky-top { animation: skyTopColor 20s ease-in-out infinite; }
    .sky-mid { animation: skyMidColor 20s ease-in-out infinite; }
    .sky-bot { animation: skyBotColor 20s ease-in-out infinite; }

    /* Stars Fade In at Night */
    @keyframes nightStars {
      0%, 48% { opacity: 0; }
      56%, 90% { opacity: 0.85; }
      98%, 100% { opacity: 0; }
    }
    .footer-stars { animation: nightStars 20s ease-in-out infinite; }

    @keyframes starPulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
    .twinkle { animation: starPulse 2.4s ease-in-out infinite; }

    /* ========================================================================= */
    /* SEAMLESS CROSS-FADE TRANSITIONS (ZERO DISAPPEARING GAP, PERFECT CONTINUITY) */
    /* ========================================================================= */

    /* 1. Sleeping Dog: Active during Day (0% to 45%, 95% to 100%) */
    /* Cross-dissolves into Howling Dog between 45% and 53% with subtle rise */
    @keyframes sleepTransition {
      0%, 45% {
        opacity: 1;
        transform: translateY(0px);
      }
      53%, 87% {
        opacity: 0;
        transform: translateY(-6px);
      }
      95%, 100% {
        opacity: 1;
        transform: translateY(0px);
      }
    }

    /* 2. Howling Dog: Active during Night (53% to 87%) */
    /* Cross-dissolves from Sleeping Dog between 45% and 53% with subtle rise */
    @keyframes howlTransition {
      0%, 45% {
        opacity: 0;
        transform: translateY(8px);
      }
      53%, 87% {
        opacity: 1;
        transform: translateY(0px);
      }
      95%, 100% {
        opacity: 0;
        transform: translateY(8px);
      }
    }

    .sleeping-dog-box {
      animation: sleepTransition 20s ease-in-out infinite;
    }

    .howling-dog-box {
      animation: howlTransition 20s ease-in-out infinite;
    }

    /* Sleeping Dog Gentle Breathing Motion */
    @keyframes dogBreathe {
      0%, 100% { transform: scale(1, 1); }
      50% { transform: scale(1.02, 1.05); }
    }
    .dog-breathe {
      transform-origin: 450px 165px;
      animation: dogBreathe 3s ease-in-out infinite;
    }

    /* Floating Zzz Letters Animation */
    @keyframes floatZ1 {
      0% { opacity: 0; transform: translate(0, 0) scale(0.6); }
      30% { opacity: 0.85; }
      80% { opacity: 0.4; }
      100% { opacity: 0; transform: translate(16px, -28px) scale(1.1); }
    }
    @keyframes floatZ2 {
      0% { opacity: 0; transform: translate(0, 0) scale(0.6); }
      30% { opacity: 0.85; }
      80% { opacity: 0.4; }
      100% { opacity: 0; transform: translate(22px, -36px) scale(1.3); }
    }
    .zzz-1 { animation: floatZ1 3.5s ease-out infinite; }
    .zzz-2 { animation: floatZ2 3.5s ease-out 1.5s infinite; }

    @keyframes zzzVisibility {
      0%, 43% { opacity: 1; }
      46%, 94% { opacity: 0; }
      97%, 100% { opacity: 1; }
    }
    .sleeping-zzz-group {
      animation: zzzVisibility 20s ease-in-out infinite;
      fill: #93c5fd;
      font-family: 'Space Grotesk', -apple-system, sans-serif;
      font-weight: 700;
    }

    /* Howling Dog Pulse Motion */
    @keyframes howlPulse {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-3deg); }
    }
    .howl-body {
      transform-origin: 450px 170px;
      animation: howlPulse 3s ease-in-out infinite;
    }

    /* Acoustic Sound Waves radiating during night howl */
    @keyframes soundRings {
      0% { opacity: 0; transform: scale(0.5); }
      40% { opacity: 0.75; }
      100% { opacity: 0; transform: scale(1.7); }
    }
    .sound-wave-1 {
      transform-origin: 432px 98px;
      animation: soundRings 2.2s ease-out infinite;
    }
    .sound-wave-2 {
      transform-origin: 432px 98px;
      animation: soundRings 2.2s ease-out 0.8s infinite;
    }

    @keyframes soundWavesActive {
      0%, 52% { opacity: 0; }
      55%, 86% { opacity: 1; }
      89%, 100% { opacity: 0; }
    }
    .sound-waves-group {
      animation: soundWavesActive 20s ease-in-out infinite;
    }

    /* Wagging Tail when happy */
    @keyframes tailWag {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(8deg); }
    }
    .dog-tail {
      transform-origin: 485px 158px;
      animation: tailWag 1.8s ease-in-out infinite;
    }
  ]]>
  </style>

  <!-- Background Sky -->
  <rect width="900" height="220" rx="16" fill="url(#footerSky)" />

  <!-- Stars during Night -->
  <g class="footer-stars">
    <circle cx="100" cy="40" r="1.5" fill="#ffffff" class="twinkle" />
    <circle cx="210" cy="70" r="1.8" fill="#93c5fd" />
    <circle cx="340" cy="35" r="1.3" fill="#ffffff" class="twinkle" />
    <circle cx="560" cy="50" r="1.6" fill="#ffffff" />
    <circle cx="680" cy="30" r="2.0" fill="#93c5fd" class="twinkle" />
    <circle cx="790" cy="65" r="1.4" fill="#ffffff" />
    <circle cx="840" cy="35" r="1.7" fill="#ffffff" class="twinkle" />
    <circle cx="280" cy="90" r="1.2" fill="#ffffff" />
    <circle cx="620" cy="80" r="1.4" fill="#93c5fd" class="twinkle" />
  </g>

  <!-- Ground / Cozy Hill Horizon -->
  <path d="M0,220 L0,175 Q200,150 450,152 T900,170 L900,220 Z" fill="url(#hillGrad)" />
  <path d="M0,220 L0,185 Q250,165 520,168 T900,180 L900,220 Z" fill="#06090e" opacity="0.9" />

  <!-- ==================================================== -->
  <!-- 1. SLEEPING DOG (Original Artwork, Day Phase)        -->
  <!-- ==================================================== -->
  <g class="sleeping-dog-box">
    <g class="dog-breathe">
      <!-- Dog Shadow -->
      <ellipse cx="450" cy="172" rx="42" ry="9" fill="#04060a" opacity="0.6" />

      <!-- Dog Curled Body -->
      <ellipse cx="448" cy="154" rx="30" ry="20" fill="#f8fafc" />
      <ellipse cx="448" cy="154" rx="27" ry="17" fill="#f1f5f9" />

      <!-- Spot on back -->
      <path d="M438,142 Q450,136 458,144 Q452,154 440,150 Z" fill="#94a3b8" opacity="0.4" />

      <!-- Dog Tail tucked -->
      <path d="M472,158 Q484,152 480,144 Q475,142 473,150 Z" fill="#f1f5f9" class="dog-tail" />

      <!-- Dog Head resting down -->
      <circle cx="424" cy="157" r="16" fill="#ffffff" />
      <!-- Flop Ear down -->
      <path d="M428,146 Q438,152 434,166 Q427,166 426,154 Z" fill="#cbd5e1" />
      <!-- Cute Snout & Sleeping Eye -->
      <ellipse cx="414" cy="162" rx="8" ry="6" fill="#f8fafc" />
      <circle cx="410" cy="160" r="2.5" fill="#1e293b" />
      <!-- Sleeping Happy Eye -->
      <path d="M420,154 Q423,158 426,154" stroke="#475569" stroke-width="1.8" fill="none" stroke-linecap="round" />

      <!-- Paws tucked -->
      <ellipse cx="432" cy="168" rx="7" ry="4" fill="#e2e8f0" />
      <ellipse cx="452" cy="168" rx="8" ry="4" fill="#e2e8f0" />
    </g>

    <!-- Floating Zzz Letters -->
    <g class="sleeping-zzz-group">
      <text x="408" y="142" font-size="14" class="zzz-1">z</text>
      <text x="418" y="132" font-size="18" class="zzz-2">Z</text>
    </g>
  </g>

  <!-- ==================================================== -->
  <!-- 2. HOWLING DOG (Original Artwork, Night Phase)       -->
  <!-- ==================================================== -->
  <g class="howling-dog-box">
    <!-- Acoustic Sound Waves radiating into the night (NO text) -->
    <g class="sound-waves-group">
      <circle cx="432" cy="98" r="18" stroke="#38bdf8" stroke-width="2" fill="none" class="sound-wave-1" opacity="0.6" />
      <circle cx="432" cy="98" r="32" stroke="#818cf8" stroke-width="1.6" fill="none" class="sound-wave-2" opacity="0.4" />
    </g>

    <g class="howl-body">
      <!-- Shadow under sitting dog -->
      <ellipse cx="452" cy="173" rx="34" ry="8" fill="#020617" opacity="0.75" />

      <!-- Dog Tail wagging up -->
      <path d="M474,162 Q490,150 488,135 Q482,134 478,146 Z" fill="#f1f5f9" class="dog-tail" />

      <!-- Body sitting upright -->
      <path d="M442,168 L440,132 Q445,120 455,128 L468,168 Z" fill="#f8fafc" />
      <!-- Hind Leg / Hip -->
      <ellipse cx="462" cy="162" rx="14" ry="11" fill="#e2e8f0" />
      <ellipse cx="448" cy="170" rx="8" ry="4" fill="#cbd5e1" />
      <ellipse cx="464" cy="170" rx="9" ry="4" fill="#cbd5e1" />

      <!-- Chest & Raised Neck pointing up-left -->
      <path d="M440,134 L432,108 Q436,100 445,108 L452,130 Z" fill="#ffffff" />

      <!-- Head turned up toward the sky -->
      <circle cx="438" cy="106" r="13" fill="#ffffff" />
      <!-- Ear tilted back in howl -->
      <path d="M444,103 Q456,108 454,120 Q446,118 444,110 Z" fill="#94a3b8" />
      <!-- Snout pointing up-left to the sky (open mouth) -->
      <path d="M434,102 L424,94 Q428,90 436,96 Z" fill="#f8fafc" />
      <!-- Tiny nose tip -->
      <circle cx="423" cy="93" r="2.2" fill="#0f172a" />
      <!-- Open mouth howling gap -->
      <path d="M428,99 L424,96 L432,102 Z" fill="#0f172a" />
      <!-- Closed focused eye singing/howling -->
      <path d="M434,105 Q437,108 440,105" stroke="#334155" stroke-width="1.5" fill="none" stroke-linecap="round" />
    </g>
  </g>
</svg>