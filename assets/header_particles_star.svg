<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="100%" height="280">
  <defs>
    <!-- Sky Gradients for Day/Night Cycle -->
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" class="sky-top" />
      <stop offset="55%" class="sky-mid" />
      <stop offset="100%" class="sky-bot" />
    </linearGradient>

    <!-- Glow Filter for Sun -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Glow Filter for Moon -->
    <filter id="moonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- User Shooting Star Head Glow (box-shadow 0 0 6px 2px rgba(255,255,255,0.9), 0 0 18px 6px rgba(255,255,255,0.35)) -->
    <filter id="userHeadGlow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="6.0" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- User Shooting Star Trail Gradient (linear-gradient to right, rgba(255,255,255,0.9), rgba(255,255,255,0)) -->
    <linearGradient id="userTrailGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
  <![CDATA[
    /* Dynamic color transitions for the sky (20s synchronized cycle) */
    @keyframes skyTopColor {
      0%, 100% { stop-color: #1f1d36; }
      18% { stop-color: #0369a1; }
      35% { stop-color: #0284c7; }
      50% { stop-color: #311432; }
      65% { stop-color: #0b0f19; }
      85% { stop-color: #030712; }
    }
    @keyframes skyMidColor {
      0%, 100% { stop-color: #7c3aed; }
      18% { stop-color: #38bdf8; }
      35% { stop-color: #7dd3fc; }
      50% { stop-color: #be123c; }
      65% { stop-color: #1e1b4b; }
      85% { stop-color: #0f172a; }
    }
    @keyframes skyBotColor {
      0%, 100% { stop-color: #f97316; }
      18% { stop-color: #bae6fd; }
      35% { stop-color: #e0f2fe; }
      50% { stop-color: #fbbf24; }
      65% { stop-color: #312e81; }
      85% { stop-color: #1e293b; }
    }

    .sky-top { animation: skyTopColor 20s ease-in-out infinite; }
    .sky-mid { animation: skyMidColor 20s ease-in-out infinite; }
    .sky-bot { animation: skyBotColor 20s ease-in-out infinite; }

    /* Sun Orbit Animation */
    @keyframes sunOrbit {
      0% {
        transform: translate(60px, 240px) scale(0.8);
        opacity: 0;
      }
      5% {
        opacity: 0.95;
      }
      20% {
        transform: translate(450px, 45px) scale(1.15);
        opacity: 1;
      }
      40% {
        transform: translate(840px, 240px) scale(0.9);
        opacity: 0.95;
      }
      45%, 100% {
        transform: translate(860px, 320px) scale(0.7);
        opacity: 0;
      }
    }

    /* Moon Orbit Animation */
    @keyframes moonOrbit {
      0%, 50% {
        transform: translate(60px, 320px) scale(0.6);
        opacity: 0;
      }
      55% {
        opacity: 0.9;
      }
      75% {
        transform: translate(450px, 50px) scale(1.05);
        opacity: 1;
      }
      95% {
        transform: translate(840px, 240px) scale(0.85);
        opacity: 0.9;
      }
      100% {
        transform: translate(860px, 320px) scale(0.7);
        opacity: 0;
      }
    }

    /* Stars Field Animation */
    @keyframes starFade {
      0%, 45% { opacity: 0; }
      55%, 90% { opacity: 0.95; }
      100% { opacity: 0; }
    }

    @keyframes starTwinkle {
      0%, 100% { opacity: 0.15; }
      50% { opacity: 1; }
    }

    .sun-group {
      animation: sunOrbit 20s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    .moon-group {
      animation: moonOrbit 20s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    .stars-field {
      animation: starFade 20s ease-in-out infinite;
    }

    .twinkle-fast { animation: starTwinkle 3.0s ease-in-out infinite; }
    .twinkle-slow { animation: starTwinkle 3.5s ease-in-out 1.2s infinite; }

    /* Sun rays continuous rotation */
    @keyframes rayRotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .sun-rays {
      transform-origin: 0 0;
      animation: rayRotate 16s linear infinite;
    }

    /* ========================================================================= */
    /* USER EXACT SHOOTING STAR + DETACHING DEBRIS PARTICLES (6s FLY, HEAD, TRAIL) */
    /* ========================================================================= */

    /* Ruota testa+scia in modo che la scia punti indietro (alto-destra a -45deg) */
    .user-comet {
      transform: rotate(-45deg);
      transform-origin: 0px 0px;
    }

    /* Contenitore che si muove: definisce traiettoria dall'alto a destra al basso a sinistra */
    @keyframes userFly {
      0%, 57.9% {
        transform: translate(710px, 20px);
        opacity: 0;
      }
      58.0% {
        transform: translate(710px, 20px);
        opacity: 1;
      }
      79.0% {
        transform: translate(520px, 210px);
        opacity: 1;
      }
      84.4% {
        transform: translate(468px, 262px);
        opacity: 0;
      }
      88.0%, 100% {
        transform: translate(468px, 262px);
        opacity: 0;
      }
    }

    /* La testa rimpicciolisce e scompare secondo il codice fornito dall'utente */
    @keyframes userHeadFade {
      0%, 57.9% {
        opacity: 0;
        transform: scale(1);
      }
      58.0% {
        opacity: 1;
        transform: scale(1);
      }
      77.5% {
        opacity: 1;
        transform: scale(0.85);
      }
      83.5% {
        opacity: 0;
        transform: scale(0.35);
      }
      88.0%, 100% {
        opacity: 0;
        transform: scale(0.35);
      }
    }

    /* La scia si "mangia" da destra (coda) verso sinistra (testa) */
    @keyframes userTrailDissipate {
      0%, 57.9% {
        clip-path: inset(0 0% 0 0);
        transform: scaleX(1);
        opacity: 0;
      }
      58.0%, 74.5% {
        clip-path: inset(0 0% 0 0);
        transform: scaleX(1);
        opacity: 1;
      }
      83.5% {
        clip-path: inset(0 100% 0 0);
        transform: scaleX(0);
        opacity: 0;
      }
      88.0%, 100% {
        clip-path: inset(0 100% 0 0);
        transform: scaleX(0);
        opacity: 0;
      }
    }

    .user-shooting-star {
      animation: userFly 20s linear infinite;
    }

    .user-head {
      transform-origin: 0px 0px;
      animation: userHeadFade 20s linear infinite;
    }

    .user-trail {
      transform-origin: 0px 0px;
      animation: userTrailDissipate 20s linear infinite;
    }

    /* ========================================================================= */
    /* PARTICELLE DI DETRITO EMESSE DALLA TESTA LUNGO LA TRAIETTORIA            */
    /* ========================================================================= */
    
    @keyframes pFade0 {
      0%, 59.5% { opacity: 0; transform: translate(0, 0) scale(0.3); }
      59.8% { opacity: 0.95; transform: translate(0, 0) scale(1); }
      63.5%, 100% { opacity: 0; transform: translate(3.9px, 8.4px) scale(0.2); }
    }
    .particle-0 {
      transform-origin: 696.4px 33.6px;
      animation: pFade0 20s ease-out infinite;
    }

    @keyframes pFade1 {
      0%, 60.8% { opacity: 0; transform: translate(0, 0) scale(0.3); }
      61.1% { opacity: 0.95; transform: translate(0, 0) scale(1); }
      64.8%, 100% { opacity: 0; transform: translate(-7.8px, 18.3px) scale(0.2); }
    }
    .particle-1 {
      transform-origin: 684.3px 45.7px;
      animation: pFade1 20s ease-out infinite;
    }

    @keyframes pFade2 {
      0%, 62.2% { opacity: 0; transform: translate(0, 0) scale(0.3); }
      62.5% { opacity: 0.95; transform: translate(0, 0) scale(1); }
      66.2%, 100% { opacity: 0; transform: translate(11.0px, 9.2px) scale(0.2); }
    }
    .particle-2 {
      transform-origin: 672.2px 57.8px;
      animation: pFade2 20s ease-out infinite;
    }

    @keyframes pFade3 {
      0%, 63.5% { opacity: 0; transform: translate(0, 0) scale(0.3); }
      63.8% { opacity: 0.95; transform: translate(0, 0) scale(1); }
      67.5%, 100% { opacity: 0; transform: translate(-13.2px, 11.1px) scale(0.2); }
    }
    .particle-3 {
      transform-origin: 660.0px 70.0px;
      animation: pFade3 20s ease-out infinite;
    }

    @keyframes pFade4 {
      0%, 64.9% { opacity: 0; transform: translate(0, 0) scale(0.3); }
      65.2% { opacity: 0.95; transform: translate(0, 0) scale(1); }
      68.9%, 100% { opacity: 0; transform: translate(-13.3px, 10.8px) scale(0.2); }
    }
    .particle-4 {
      transform-origin: 647.9px 82.1px;
      animation: pFade4 20s ease-out infinite;
    }

    @keyframes pFade5 {
      0%, 66.2% { opacity: 0; transform: translate(0, 0) scale(0.3); }
      66.5% { opacity: 0.95; transform: translate(0, 0) scale(1); }
      70.2%, 100% { opacity: 0; transform: translate(1.3px, 11.1px) scale(0.2); }
    }
    .particle-5 {
      transform-origin: 635.8px 94.2px;
      animation: pFade5 20s ease-out infinite;
    }

    @keyframes pFade6 {
      0%, 67.5% { opacity: 0; transform: translate(0, 0) scale(0.3); }
      67.8% { opacity: 0.95; transform: translate(0, 0) scale(1); }
      71.5%, 100% { opacity: 0; transform: translate(8.7px, 8.1px) scale(0.2); }
    }
    .particle-6 {
      transform-origin: 623.6px 106.4px;
      animation: pFade6 20s ease-out infinite;
    }

    @keyframes pFade7 {
      0%, 68.9% { opacity: 0; transform: translate(0, 0) scale(0.3); }
      69.2% { opacity: 0.95; transform: translate(0, 0) scale(1); }
      72.9%, 100% { opacity: 0; transform: translate(5.5px, 12.8px) scale(0.2); }
    }
    .particle-7 {
      transform-origin: 611.5px 118.5px;
      animation: pFade7 20s ease-out infinite;
    }

    @keyframes pFade8 {
      0%, 70.2% { opacity: 0; transform: translate(0, 0) scale(0.3); }
      70.5% { opacity: 0.95; transform: translate(0, 0) scale(1); }
      74.2%, 100% { opacity: 0; transform: translate(12.8px, 12.7px) scale(0.2); }
    }
    .particle-8 {
      transform-origin: 599.4px 130.6px;
      animation: pFade8 20s ease-out infinite;
    }

    @keyframes pFade9 {
      0%, 71.6% { opacity: 0; transform: translate(0, 0) scale(0.3); }
      71.9% { opacity: 0.95; transform: translate(0, 0) scale(1); }
      75.6%, 100% { opacity: 0; transform: translate(-11.3px, 19.9px) scale(0.2); }
    }
    .particle-9 {
      transform-origin: 587.2px 142.8px;
      animation: pFade9 20s ease-out infinite;
    }

    @keyframes pFade10 {
      0%, 72.9% { opacity: 0; transform: translate(0, 0) scale(0.3); }
      73.2% { opacity: 0.95; transform: translate(0, 0) scale(1); }
      76.9%, 100% { opacity: 0; transform: translate(8.6px, 18.2px) scale(0.2); }
    }
    .particle-10 {
      transform-origin: 575.1px 154.9px;
      animation: pFade10 20s ease-out infinite;
    }

    @keyframes pFade11 {
      0%, 74.3% { opacity: 0; transform: translate(0, 0) scale(0.3); }
      74.6% { opacity: 0.95; transform: translate(0, 0) scale(1); }
      78.3%, 100% { opacity: 0; transform: translate(13.2px, 13.3px) scale(0.2); }
    }
    .particle-11 {
      transform-origin: 562.9px 167.1px;
      animation: pFade11 20s ease-out infinite;
    }

    @keyframes pFade12 {
      0%, 75.6% { opacity: 0; transform: translate(0, 0) scale(0.3); }
      75.9% { opacity: 0.95; transform: translate(0, 0) scale(1); }
      79.6%, 100% { opacity: 0; transform: translate(9.2px, 16.7px) scale(0.2); }
    }
    .particle-12 {
      transform-origin: 550.8px 179.2px;
      animation: pFade12 20s ease-out infinite;
    }

    @keyframes pFade13 {
      0%, 76.9% { opacity: 0; transform: translate(0, 0) scale(0.3); }
      77.2% { opacity: 0.95; transform: translate(0, 0) scale(1); }
      80.9%, 100% { opacity: 0; transform: translate(2.2px, 17.9px) scale(0.2); }
    }
    .particle-13 {
      transform-origin: 538.7px 191.3px;
      animation: pFade13 20s ease-out infinite;
    }

    @keyframes pFade14 {
      0%, 78.3% { opacity: 0; transform: translate(0, 0) scale(0.3); }
      78.6% { opacity: 0.95; transform: translate(0, 0) scale(1); }
      82.3%, 100% { opacity: 0; transform: translate(-7.6px, 12.1px) scale(0.2); }
    }
    .particle-14 {
      transform-origin: 526.5px 203.5px;
      animation: pFade14 20s ease-out infinite;
    }

    @keyframes pFade15 {
      0%, 79.6% { opacity: 0; transform: translate(0, 0) scale(0.3); }
      79.9% { opacity: 0.95; transform: translate(0, 0) scale(1); }
      83.6%, 100% { opacity: 0; transform: translate(-7.5px, 9.4px) scale(0.2); }
    }
    .particle-15 {
      transform-origin: 514.1px 215.9px;
      animation: pFade15 20s ease-out infinite;
    }

    @keyframes pFade16 {
      0%, 81.0% { opacity: 0; transform: translate(0, 0) scale(0.3); }
      81.3% { opacity: 0.95; transform: translate(0, 0) scale(1); }
      85.0%, 100% { opacity: 0; transform: translate(3.8px, 13.1px) scale(0.2); }
    }
    .particle-16 {
      transform-origin: 501.1px 228.9px;
      animation: pFade16 20s ease-out infinite;
    }

    @keyframes pFade17 {
      0%, 82.3% { opacity: 0; transform: translate(0, 0) scale(0.3); }
      82.6% { opacity: 0.95; transform: translate(0, 0) scale(1); }
      86.3%, 100% { opacity: 0; transform: translate(-8.1px, 11.7px) scale(0.2); }
    }
    .particle-17 {
      transform-origin: 488.2px 241.8px;
      animation: pFade17 20s ease-out infinite;
    }
  ]]>
  </style>

  <!-- Sky Background -->
  <rect width="900" height="280" rx="16" fill="url(#skyGradient)" />

  <!-- Stars Layer -->
  <g class="stars-field">
    <circle cx="120" cy="45" r="1.6" fill="#ffffff" class="twinkle-fast" />
    <circle cx="180" cy="90" r="2.0" fill="#93c5fd" class="twinkle-slow" />
    <circle cx="240" cy="35" r="1.4" fill="#ffffff" class="twinkle-fast" />
    <circle cx="310" cy="80" r="2.2" fill="#ffffff" class="twinkle-slow" />
    <circle cx="380" cy="40" r="1.5" fill="#93c5fd" class="twinkle-fast" />
    <circle cx="520" cy="50" r="1.9" fill="#ffffff" class="twinkle-slow" />
    <circle cx="580" cy="85" r="1.6" fill="#ffffff" class="twinkle-fast" />
    <circle cx="660" cy="35" r="2.4" fill="#93c5fd" class="twinkle-slow" />
    <circle cx="730" cy="75" r="1.7" fill="#ffffff" class="twinkle-fast" />
    <circle cx="800" cy="45" r="2.0" fill="#ffffff" class="twinkle-slow" />
    <circle cx="850" cy="110" r="1.5" fill="#93c5fd" class="twinkle-fast" />
    <circle cx="150" cy="130" r="1.7" fill="#ffffff" class="twinkle-slow" />
    <circle cx="710" cy="120" r="1.4" fill="#ffffff" class="twinkle-fast" />
    <circle cx="280" cy="65" r="1.2" fill="#ffffff" class="twinkle-slow" />
    <circle cx="440" cy="30" r="1.5" fill="#93c5fd" class="twinkle-fast" />
    <circle cx="620" cy="115" r="1.3" fill="#ffffff" class="twinkle-slow" />
  </g>

  <!-- Particelle di detrito che si staccano dalla stella e cadono -->
  <g class="debris-particles">
    <circle cx="696.4" cy="33.6" r="1.3" fill="#ffffff" class="particle-0" />
    <circle cx="684.3" cy="45.7" r="1.65" fill="#ffffff" class="particle-1" />
    <circle cx="672.2" cy="57.8" r="1.45" fill="#ffffff" class="particle-2" />
    <circle cx="660.0" cy="70.0" r="1.5" fill="#ffffff" class="particle-3" />
    <circle cx="647.9" cy="82.1" r="1.6" fill="#ffffff" class="particle-4" />
    <circle cx="635.8" cy="94.2" r="1.55" fill="#ffffff" class="particle-5" />
    <circle cx="623.6" cy="106.4" r="1.75" fill="#ffffff" class="particle-6" />
    <circle cx="611.5" cy="118.5" r="1.2" fill="#ffffff" class="particle-7" />
    <circle cx="599.4" cy="130.6" r="1.15" fill="#ffffff" class="particle-8" />
    <circle cx="587.2" cy="142.8" r="1.6" fill="#ffffff" class="particle-9" />
    <circle cx="575.1" cy="154.9" r="1.55" fill="#ffffff" class="particle-10" />
    <circle cx="562.9" cy="167.1" r="1.55" fill="#ffffff" class="particle-11" />
    <circle cx="550.8" cy="179.2" r="1.8" fill="#ffffff" class="particle-12" />
    <circle cx="538.7" cy="191.3" r="1.15" fill="#ffffff" class="particle-13" />
    <circle cx="526.5" cy="203.5" r="1.15" fill="#ffffff" class="particle-14" />
    <circle cx="514.1" cy="215.9" r="1.3" fill="#ffffff" class="particle-15" />
    <circle cx="501.1" cy="228.9" r="1.4" fill="#ffffff" class="particle-16" />
    <circle cx="488.2" cy="241.8" r="1.85" fill="#ffffff" class="particle-17" />
  </g>

  <!-- ========================================================================= -->
  <!-- USER SHOOTING STAR (Comet: Head + Dissipating Trail)                      -->
  <!-- ========================================================================= -->
  <g class="user-shooting-star">
    <g class="user-comet">
      <!-- Trail: 140px width, 2px height, linear-gradient to right -->
      <rect class="user-trail" x="0" y="-1" width="140" height="2" fill="url(#userTrailGrad)" />
      <!-- Head: 6px diameter (r=3), white, dual luminous glow, scaling down -->
      <g class="user-head">
        <circle cx="0" cy="0" r="3" fill="#ffffff" filter="url(#userHeadGlow)" />
        <circle cx="0" cy="0" r="3" fill="#ffffff" />
      </g>
    </g>
  </g>

  <!-- Animated Sun Group -->
  <g class="sun-group" filter="url(#glow)">
    <g class="sun-rays">
      <circle cx="0" cy="0" r="38" fill="#fef08a" opacity="0.25" />
      <polygon points="0,-46 7,-32 30,-30 32,-7 46,0 32,7 30,30 7,32 0,46 -7,32 -30,30 -32,7 -46,0 -32,-7 -30,-30 -7,-32" fill="#fde047" opacity="0.4" />
    </g>
    <circle cx="0" cy="0" r="26" fill="#fef9c3" />
    <circle cx="0" cy="0" r="22" fill="#facc15" />
    <circle cx="0" cy="0" r="17" fill="#fef08a" />
  </g>

  <!-- Animated Moon Group -->
  <g class="moon-group" filter="url(#moonGlow)">
    <circle cx="0" cy="0" r="20" fill="#f8fafc" />
    <circle cx="7" cy="-5" r="17" fill="#0f172a" opacity="0.88" />
  </g>

  <!-- Landscape Mountains Silhouettes -->
  <g opacity="0.95">
    <path d="M0,280 L0,195 Q140,150 280,190 T560,185 Q720,145 900,190 L900,280 Z" fill="#1e1b4b" opacity="0.5" />
    <path d="M0,280 L0,215 Q180,175 380,210 Q600,165 900,215 L900,280 Z" fill="#0f172a" opacity="0.8" />
    <path d="M0,280 L0,238 Q220,205 450,235 T900,228 L900,280 Z" fill="#080c14" />
  </g>

  <!-- Clean Title Overlay -->
  <text x="50%" y="254" text-anchor="middle" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="22" font-weight="700" fill="#ffffff" letter-spacing="4">
    THEMEIG
  </text>
  <text x="50%" y="271" text-anchor="middle" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="10" font-weight="500" fill="#94a3b8" letter-spacing="2">
    SOFTWARE ENGINEERING • AUTOMATION &amp; SYSTEMS
  </text>
</svg>